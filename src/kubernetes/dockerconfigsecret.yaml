# Pull secret referenced by every Deployment (imagePullSecrets: dockerconfigjson).
#
# The images in ghcr.io/koryun13/architecture-cinemaabyss are public, so this
# secret deliberately carries no credentials: base64 of {"auths":{}}. A token
# must never be committed to a public repository.
#
# For private images, create the secret from a read:packages token instead of
# applying this file:
#
#   kubectl -n cinemaabyss create secret docker-registry dockerconfigjson #     --docker-server=ghcr.io --docker-username=<login> --docker-password=<PAT>
apiVersion: v1
kind: Secret
metadata:
  name: dockerconfigjson
  namespace: cinemaabyss
data:
  .dockerconfigjson: eyJhdXRocyI6e319
type: kubernetes.io/dockerconfigjson
