apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  # Replaces the deprecated kubernetes.io/ingress.class annotation; the API
  # server rejects an Ingress that sets both.
  ingressClassName: nginx
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:
          # Single entry point: everything goes through the Strangler Fig proxy,
          # which routes /api/movies by the feature flag and the rest to the monolith.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 80
          # Events are exposed directly as well, so the Postman tests can reach
          # the events service health check and event creation.
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8082
